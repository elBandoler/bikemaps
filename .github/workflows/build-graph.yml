name: Rebuild routing graph

# Rebuilds graph.json from the full rideable OSM network (via Overpass),
# welding the roads.geojson classes on as cost preferences, then commits the
# result and kicks a Pages deploy. Run manually, or automatically when the
# classification or pipeline changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/github-setup-deploy-bztejk # initial setup branch; remove once merged to main
    paths:
      - roads.geojson
      - build_graph.py
      - requirements.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: build-graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make graph
      - name: Commit updated graph
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph.json
          if git diff --cached --quiet; then
            echo "graph.json unchanged, nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild graph.json from full OSM network"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't fire the pages workflow's push
      # trigger, so dispatch it explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
