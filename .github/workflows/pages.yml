name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-setup-deploy-bztejk # initial setup branch; remove once merged to main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # branch tip at run time, not the SHA snapshotted when the run was
          # queued — a dispatch fired right after the graph-rebuild push could
          # otherwise deploy the commit *before* the new graph.json
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
