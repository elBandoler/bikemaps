<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1626">
<link rel="manifest" href="manifest.webmanifest">
<title>Bike Router</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0e1626;--panel:#16223a;--field:#0b1220;--ink:#eaf2ff;--muted:#8fa3c0;
        --accent:#22d3ee;--go:#22c55e;--route:#8b5cf6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #map{position:absolute;inset:0;background:#0a0f1c}
  .card{background:var(--panel);color:var(--ink);border-radius:18px;
        box-shadow:0 10px 40px rgba(0,0,0,.55)}
  button{border:0;cursor:pointer;font-weight:700}
  button:active{transform:scale(.97)}

  /* ---- "Where to?" pill (idle) ---- */
  #searchPill{position:absolute;z-index:1100;top:12px;left:12px;right:12px;max-width:440px;
    display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:16px;
    color:var(--muted);cursor:pointer}
  #searchPill b{color:var(--ink);font-weight:600}

  /* ---- search card (also stays open in route preview) ---- */
  #searchCard{position:absolute;z-index:1200;top:12px;left:12px;right:12px;max-width:440px;
    padding:10px;display:none;flex-direction:column;gap:8px}
  .inputRow{display:flex;align-items:center;gap:10px;background:var(--field);
    border-radius:12px;padding:2px 12px}
  .inputRow .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.start{background:#22d3ee}.dot.end{background:#f472b6}
  .inputRow input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);
    font-size:15px;padding:11px 0;outline:none}
  .inputRow input::placeholder{color:var(--muted)}
  .inputRow .clear{background:none;color:var(--muted);font-size:15px;padding:4px}
  #suggest{background:var(--field);border-radius:12px;max-height:38vh;overflow:auto;display:none}
  .sug{padding:11px 14px;font-size:14px;line-height:1.35;cursor:pointer}
  .sug+.sug{border-top:1px solid #1d2b47}
  .sug:hover{background:#1d2b47}
  .sug small{color:var(--muted);display:block}
  #swapBtn{align-self:flex-end;background:none;color:var(--muted);font-size:13px;padding:4px 8px}

  /* ---- floating round buttons ---- */
  .fab{position:absolute;z-index:1000;width:52px;height:52px;border-radius:50%;
    background:var(--panel);color:var(--ink);font-size:22px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  #layersBtn{right:12px;top:84px}
  #locBtn{right:12px;bottom:190px}
  #locBtn.on{background:var(--accent);color:#062331}
  #recenter{right:12px;bottom:252px;background:var(--accent);color:#062331;display:none}

  .legend{position:absolute;z-index:1000;top:144px;right:12px;padding:10px 12px;
    font-size:12px;line-height:1.8;display:none}
  .sw{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .legend label{display:flex;gap:6px;align-items:center;color:var(--muted);margin-top:4px;font-size:12px}

  /* ---- route preview sheet ---- */
  #sheet{position:absolute;z-index:1100;left:12px;right:12px;bottom:12px;max-width:440px;
    margin:0 auto;padding:12px;display:none;flex-direction:column;gap:10px}
  #altChips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none;background:var(--field);border:2px solid transparent;border-radius:12px;
    padding:8px 12px;font-size:12px;color:var(--muted);cursor:pointer;line-height:1.35}
  .chip b{display:block;color:var(--ink);font-size:15px}
  .chip.sel{border-color:var(--route);color:var(--ink)}
  #sheetRow{display:flex;gap:12px;align-items:center}
  #sheet .big{font-size:34px;font-weight:800;line-height:1}
  #sheet .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
  #sheet .sub{color:var(--muted);font-size:13px;margin-top:4px}
  #sheet .grow{flex:1;min-width:0}
  #go{background:var(--go);color:#04120a;font-size:20px;border-radius:50%;
    width:70px;height:70px;flex:none;letter-spacing:.5px}
  #gpxBtn,#closeRoute{background:#26334f;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}

  /* ---- navigation bar ---- */
  #navBar{position:absolute;z-index:1100;left:12px;right:12px;bottom:12px;max-width:440px;
    margin:0 auto;padding:14px 16px;display:none;gap:12px;align-items:center}
  #navBar .big{font-size:32px;font-weight:800;line-height:1;color:var(--accent)}
  #navBar .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
  #navBar .sub{color:var(--muted);font-size:13px;margin-top:4px}
  #navBar .grow{flex:1;min-width:0}
  #stopNavBtn{background:#3b1d2a;color:#fda4af;border-radius:50%;width:48px;height:48px;font-size:18px;flex:none}
  #voiceBtn{background:#26334f;color:var(--ink);border-radius:50%;width:48px;height:48px;font-size:18px;flex:none}
  #voiceBtn.off{opacity:.45}

  /* ---- next-turn banner (navigation) ---- */
  #turnBanner{position:absolute;z-index:1100;top:12px;left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:10px;padding:12px 20px;font-size:22px;font-weight:800;
    color:var(--ink);white-space:nowrap}
  #turnBanner .arr{font-size:30px;color:var(--accent);line-height:1}

  /* ---- speedometer ---- */
  #speed{position:absolute;z-index:1100;left:12px;bottom:104px;width:76px;height:76px;
    border-radius:50%;background:#fff;color:#0b1220;display:none;flex-direction:column;
    align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.5);
    border:4px solid #cbd5e1}
  #speed b{font-size:24px;line-height:1}
  #speed small{font-size:10px;color:#64748b;margin-top:2px}

  #hint{position:absolute;z-index:1050;left:12px;right:12px;bottom:104px;max-width:440px;margin:0 auto;
    text-align:center;pointer-events:none}
  #hint span{display:inline-block;background:rgba(11,18,32,.9);color:var(--muted);font-size:13px;
    padding:8px 14px;border-radius:999px}
</style>
</head>
<body>
<div id="map"></div>

<div id="searchPill" class="card">🔍 <span><b>Where to?</b></span></div>

<div id="searchCard" class="card">
  <div class="inputRow"><span class="dot start"></span>
    <input id="fromInp" placeholder="My location" autocomplete="off" enterkeyhint="search">
    <button class="clear" data-clear="A" title="Clear">✕</button>
  </div>
  <div class="inputRow"><span class="dot end"></span>
    <input id="toInp" placeholder="Where to?" autocomplete="off" enterkeyhint="search">
    <button class="clear" data-clear="B" title="Clear">✕</button>
  </div>
  <div id="suggest"></div>
  <button id="swapBtn">⇅ swap</button>
</div>

<button id="layersBtn" class="fab" title="Bike roads">🚲</button>
<div class="legend card" id="legend"></div>
<button id="locBtn" class="fab" title="My location / speedometer">📍</button>
<button id="recenter" class="fab" title="Re-center">⌖</button>

<div id="sheet" class="card">
  <div id="altChips"></div>
  <div id="sheetRow">
    <div class="grow">
      <div class="big"><span id="etaMin">–</span><small>min</small></div>
      <div class="sub" id="routeSub"></div>
    </div>
    <button id="gpxBtn" title="Export GPX for OsmAnd">⬇ GPX</button>
    <button id="closeRoute" title="Cancel">✕</button>
    <button id="go">GO</button>
  </div>
</div>

<div id="turnBanner" class="card"><span class="arr" id="turnArr">⬆</span><span id="turnTxt"></span></div>

<div id="navBar" class="card">
  <div class="grow">
    <div class="big"><span id="navMin">–</span><small>min</small></div>
    <div class="sub" id="navSub"></div>
  </div>
  <button id="voiceBtn" title="Voice guidance">🔊</button>
  <button id="stopNavBtn" title="Stop">✕</button>
</div>
<div id="speed"><b id="speedVal">–</b><small>km/h</small></div>
<div id="hint"><span id="hintTxt">Loading network…</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- config ----------
const GRAPH_URL = "./graph.json";
const MIN_MULT = 0.35;               // best discount → keeps A* heuristic admissible
const BIKE_KMH = 15;                 // for ETA display
const OFFROUTE_M = 60;               // metres off the line before we re-route
const ARRIVE_M = 30;
const ALT_PENALTY = 2.0;             // cost factor on used edges when hunting an alternative
const MULT = [0.35, 0.55, 0.60, 1.0, 4.0, 0.45];   // must mirror build_graph.py CODE order
const CLASS = [
  {name:"Dedicated bike road", color:"#22c55e", bike:true},
  {name:"Bike lane",           color:"#3b82f6", bike:true},
  {name:"Bike-friendly road",  color:"#38bdf8", bike:true},
  {name:"Other road",          color:"#94a3b8"},
  {name:"Hostile (big road)",  color:"#ef4444"},
  {name:"Cycleway (unclassified)", color:"#2dd4bf", bike:true},
];
const LABEL={bike:"Bike priority", short:"Shortest", alt:"Alternative"};
// ---------- state ----------
let NODES=[], EDGES=[], ADJ=[], LEN=null;
let origin=null, dest=null, oMarker=null, dMarker=null, lastRoute=null;
let ALTS=[], selKey="bike";
let netLayer=null, meMarker=null, showNet=true, showAllRoads=false;

const $=id=>document.getElementById(id);
const map = L.map("map",{preferCanvas:true, zoomControl:false}).setView([31.77,35.21],13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap · geocoding © Photon/Nominatim"}).addTo(map);

// ---------- min-heap ----------
class Heap{constructor(){this.a=[];}
 push(p,v){const a=this.a;a.push([p,v]);let i=a.length-1;while(i>0){const par=(i-1)>>1;if(a[par][0]<=a[i][0])break;[a[par],a[i]]=[a[i],a[par]];i=par;}}
 pop(){const a=this.a;const top=a[0];const last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,s=i;if(l<a.length&&a[l][0]<a[s][0])s=l;if(r<a.length&&a[r][0]<a[s][0])s=r;if(s===i)break;[a[s],a[i]]=[a[i],a[s]];i=s;}}return top;}
 get size(){return this.a.length;}}

// ---------- geo helpers ----------
const toR=Math.PI/180, RE=6371000;
function hav(aLat,aLng,bLat,bLng){
  const dLat=(bLat-aLat)*toR,dLng=(bLng-aLng)*toR;
  const s=Math.sin(dLat/2)**2+Math.cos(aLat*toR)*Math.cos(bLat*toR)*Math.sin(dLng/2)**2;
  return 2*RE*Math.asin(Math.sqrt(s));
}
function nearest(lat,lng){
  let best=-1,bd=Infinity;const cw=Math.cos(lat*toR);
  for(let i=0;i<NODES.length;i++){const dy=NODES[i][0]-lat,dx=(NODES[i][1]-lng)*cw;
    const d=dy*dy+dx*dx;if(d<bd){bd=d;best=i;}}
  return best;
}

// ---------- A* (mode: 'cost' = comfort-weighted, 'length' = pure distance) ----------
function astar(src,dst,mode="cost",pen=null){
  const n=NODES.length, hm=(mode==="length")?1:MIN_MULT;
  const H=(u)=>hav(NODES[u][0],NODES[u][1],NODES[dst][0],NODES[dst][1])*hm;
  const g=new Float64Array(n).fill(Infinity);
  const came=new Int32Array(n).fill(-1);
  const cameEdge=new Int32Array(n).fill(-1);
  const closed=new Uint8Array(n);
  g[src]=0; const open=new Heap(); open.push(H(src),src);
  while(open.size){
    const [,u]=open.pop(); if(closed[u])continue; closed[u]=1; if(u===dst)break;
    const nb=ADJ[u]; for(let j=0;j<nb.length;j++){
      const v=nb[j][0],ei=nb[j][2]; if(closed[v])continue;
      let w=(mode==="length")?LEN[ei]:nb[j][1];
      if(pen&&pen.has(ei))w*=ALT_PENALTY;
      const ng=g[u]+w;
      if(ng<g[v]){g[v]=ng;came[v]=u;cameEdge[v]=ei;open.push(ng+H(v),v);}
    }
  }
  if(g[dst]===Infinity)return null;
  const seq=[]; let cur=dst; while(cur!==src){seq.push(cameEdge[cur]);cur=came[cur];} seq.reverse();
  let line=[]; for(const ei of seq){let c=EDGES[ei][4]; if(line.length)c=c.slice(1); line=line.concat(c);}
  let meters=0; for(let i=1;i<line.length;i++) meters+=hav(line[i-1][0],line[i-1][1],line[i][0],line[i][1]);
  return {line, meters, seq};
}
const sig=r=>r.seq.length+"/"+r.seq[0]+"/"+r.seq[r.seq.length-1]+"/"+Math.round(r.meters);
function computeAlts(src,dst){
  const out=[];
  const r1=astar(src,dst,"cost"); if(!r1)return out;
  r1.key="bike"; out.push(r1);
  const r2=astar(src,dst,"length");
  if(r2&&sig(r2)!==sig(r1)){r2.key="short";out.push(r2);}
  const r3=astar(src,dst,"cost",new Set(r1.seq));
  if(r3&&sig(r3)!==sig(r1)&&(!r2||sig(r3)!==sig(r2))){r3.key="alt";out.push(r3);}
  return out;
}

// ---------- rendering ----------
function drawNetwork(){
  if(netLayer){netLayer.remove();netLayer=null;}
  if(!showNet)return;
  const feats=[];
  for(const e of EDGES){
    const code=e[3], bike=!!CLASS[code].bike;
    if(!showAllRoads && !bike) continue;
    feats.push(L.polyline(e[4],{color:CLASS[code].color,weight:bike?3:1.5,
      opacity:bike?0.85:0.45,interactive:false}));
  }
  netLayer=L.layerGroup(feats).addTo(map);
  ALTS.forEach(r=>r._pl&&r._pl.bringToFront());
}
function buildLegend(){ // only classes that actually exist in the graph
  const present=new Set(EDGES.map(e=>e[3]));
  $("legend").innerHTML = CLASS.map((c,i)=>present.has(i)?
    `<div><span class="sw" style="background:${c.color}"></span>${c.name}</div>`:"").join("")+
    `<label><input type="checkbox" id="allRoadsChk"> show all roads</label>`;
  $("allRoadsChk").onchange=e=>{showAllRoads=e.target.checked;drawNetwork();};
}

let altLayer=[];   // every drawn route line lives here, whatever happens to ALTS
function clearAltLines(){altLayer.forEach(l=>l.remove());altLayer=[];ALTS.forEach(r=>r._pl=null);}
function drawAlts(onlySelected){
  clearAltLines();
  for(const r of ALTS){
    if(onlySelected&&r.key!==selKey)continue;
    const sel=r.key===selKey;
    r._pl=L.polyline(r.line,{color:sel?"#8b5cf6":"#5b6b8c",weight:sel?7:5,
      opacity:sel?0.95:0.7}).addTo(map);
    if(!sel)r._pl.on("click",()=>selectAlt(r.key));
    altLayer.push(r._pl);
  }
  const s=ALTS.find(r=>r.key===selKey);
  if(s&&s._pl)s._pl.bringToFront();
}

// ---------- UI helpers ----------
function hint(t,ms){$("hintTxt").textContent=t;$("hint").style.display=t?"block":"none";
  clearTimeout(hint._t); if(ms)hint._t=setTimeout(()=>$("hint").style.display="none",ms);}
function fmtClock(min){const d=new Date(Date.now()+min*60000);
  return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function etaMin(m){return Math.max(1,Math.round(m/1000/BIKE_KMH*60));}
function show(el,on,flex){el.style.display=on?(flex||"flex"):"none";}

// ---------- endpoints & routing ----------
const fromInp=$("fromInp"), toInp=$("toInp");

function setEndpoint(which, latlng, label){
  const i=nearest(latlng.lat,latlng.lng);
  const p=L.latLng(NODES[i][0],NODES[i][1]);
  if(which==="A"){
    origin=i;
    if(oMarker) oMarker.setLatLng(p);
    else oMarker=L.circleMarker(p,{radius:8,color:"#062331",weight:2,fillColor:"#22d3ee",fillOpacity:1}).addTo(map);
    fromInp.value=label;
  }else{
    dest=i;
    if(dMarker) dMarker.setLatLng(p);
    else dMarker=L.circleMarker(p,{radius:8,color:"#310618",weight:2,fillColor:"#f472b6",fillOpacity:1}).addTo(map);
    toInp.value=label;
  }
  tryRoute();
}
function tryRoute(){
  if(dest===null){hint("Where to? Pick a destination.",4000);return;}
  if(origin===null){ // Waze-style: start defaults to where you are
    if(!navigator.geolocation){hint("No GPS — type a start address.");return;}
    hint("Locating you…");
    navigator.geolocation.getCurrentPosition(pos=>{
      const p=L.latLng(pos.coords.latitude,pos.coords.longitude);
      updateMe(p);
      setEndpoint("A",p,"My location");
    },()=>hint("Couldn't get GPS — type a start address."),
      {enableHighAccuracy:true,timeout:8000});
    return;
  }
  if(navWatch!==null){ // re-route while navigating: single route in the chosen style
    const r=astar(origin,dest,selKey==="short"?"length":"cost");
    if(!r){hint("No route found.",4000);return;}
    clearAltLines();
    r.key=selKey; ALTS=[r]; lastRoute=r; buildCum(); computeTurns(); drawAlts(true);
    const min=etaMin(r.meters);
    $("navMin").textContent=min;
    $("navSub").textContent=`${(r.meters/1000).toFixed(1)} km · arrive ${fmtClock(min)}`;
    hint("Re-routed",2500); speak("Route recalculated");
    return;
  }
  clearAltLines();
  ALTS=computeAlts(origin,dest);
  if(!ALTS.length){hint("No route found between these points.",5000);return;}
  selKey="bike";   // every new query starts from the bike-priority route
  if(!ALTS.some(r=>r.key===selKey))selKey=ALTS[0].key;
  lastRoute=ALTS.find(r=>r.key===selKey); buildCum();
  drawAlts(false); updateSheet(); showSuggestions([]);
  let b=null; ALTS.forEach(r=>{if(!b)b=L.latLngBounds(r.line);r.line.forEach(c=>b.extend(c));});
  map.fitBounds(b,{padding:[80,120]});
  show($("searchPill"),false); show($("searchCard"),true); show($("sheet"),true); hint("");
}
function updateSheet(){
  $("altChips").innerHTML=ALTS.map(r=>
    `<div class="chip ${r.key===selKey?"sel":""}" data-k="${r.key}">${LABEL[r.key]}` +
    `<b>${etaMin(r.meters)} min</b>${(r.meters/1000).toFixed(1)} km</div>`).join("");
  document.querySelectorAll("#altChips .chip").forEach(c=>
    c.addEventListener("click",()=>selectAlt(c.dataset.k)));
  const r=lastRoute, min=etaMin(r.meters);
  $("etaMin").textContent=min;
  $("routeSub").textContent=`${(r.meters/1000).toFixed(1)} km · arrive ${fmtClock(min)} · ${LABEL[selKey].toLowerCase()}`;
}
function selectAlt(k){
  if(!ALTS.some(r=>r.key===k))return;
  selKey=k; lastRoute=ALTS.find(r=>r.key===k); buildCum();
  drawAlts(false); updateSheet();
}
function clearEndpoint(which){
  if(which==="A"){origin=null;fromInp.value="";if(oMarker){oMarker.remove();oMarker=null;}}
  else{dest=null;toInp.value="";if(dMarker){dMarker.remove();dMarker=null;}}
  clearRoute();
}
function clearRoute(){
  clearAltLines(); ALTS=[]; lastRoute=null;
  show($("sheet"),false);
}
function backToIdle(){
  stopNav(); clearRoute();
  clearEndpoint("A"); clearEndpoint("B");
  show($("searchCard"),false); show($("searchPill"),true); hint("");
}
function updateMe(p){
  if(!meMarker)meMarker=L.circleMarker(p,{radius:7,color:"#fff",weight:2,fillColor:"#0ea5e9",fillOpacity:1}).addTo(map);
  else meMarker.setLatLng(p);
}
$("swapBtn").onclick=()=>{
  const o=origin,d=dest,ov=fromInp.value,dv=toInp.value;
  if(o===null&&d===null)return;
  origin=d;dest=o;fromInp.value=dv;toInp.value=ov;
  const op=oMarker?oMarker.getLatLng():null, dp=dMarker?dMarker.getLatLng():null;
  if(oMarker){oMarker.remove();oMarker=null;} if(dMarker){dMarker.remove();dMarker=null;}
  if(dp)oMarker=L.circleMarker(dp,{radius:8,color:"#062331",weight:2,fillColor:"#22d3ee",fillOpacity:1}).addTo(map);
  if(op)dMarker=L.circleMarker(op,{radius:8,color:"#310618",weight:2,fillColor:"#f472b6",fillOpacity:1}).addTo(map);
  clearAltLines();ALTS=[];lastRoute=null;
  tryRoute();
};

// ---------- search card ----------
function openSearch(focusTo){
  show($("searchCard"),true); show($("searchPill"),false);
  if(focusTo)toInp.focus();
}
$("searchPill").onclick=()=>openSearch(true);

// ---------- address search (Photon autocomplete, Nominatim fallback) ----------
const sugBox=$("suggest");
let sugItems=[], sugFor=null, debounceT=null, searchSeq=0;

async function geocode(q){
  const c=map.getCenter();
  try{
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${c.lat}&lon=${c.lng}`);
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    const seen=new Set();
    return d.features.map(f=>{
      const p=f.properties||{};
      const main=[p.name,[p.street,p.housenumber].filter(Boolean).join(" ")].filter(Boolean)[0]||q;
      const sub=[p.city||p.town||p.village||p.district,p.country].filter(Boolean).join(", ");
      return {label:main,sub,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};
    }).filter(s=>{const k=s.label+"|"+s.sub;if(seen.has(k))return false;seen.add(k);return true;});
  }catch(_){
    const b=map.getBounds();
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=${encodeURIComponent(q)}`+
      `&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`);
    if(!r.ok)return [];
    const d=await r.json();
    return d.map(x=>({label:x.display_name.split(",")[0],sub:x.display_name.split(",").slice(1,4).join(","),
      lat:+x.lat,lng:+x.lon}));
  }
}
function showSuggestions(items){
  sugItems=items;
  if(!items.length){sugBox.style.display="none";sugBox.innerHTML="";return;}
  sugBox.innerHTML=items.map((s,i)=>
    `<div class="sug" data-i="${i}">${s.label}<small>${s.sub||""}</small></div>`).join("");
  sugBox.style.display="block";
}
function chooseSuggestion(i){
  const s=sugItems[i]; if(!s)return;
  showSuggestions([]);
  const which=sugFor;
  setEndpoint(which, L.latLng(s.lat,s.lng), s.sub?`${s.label}, ${s.sub}`:s.label);
  (which==="A"?fromInp:toInp).blur();
}
function attachSearch(inp, which){
  inp.addEventListener("input",()=>{
    sugFor=which;
    if(which==="A"&&origin!==null){origin=null;if(oMarker){oMarker.remove();oMarker=null;}clearRoute();show($("searchCard"),true,"flex");}
    if(which==="B"&&dest!==null){dest=null;if(dMarker){dMarker.remove();dMarker=null;}clearRoute();show($("searchCard"),true,"flex");}
    clearTimeout(debounceT);
    const q=inp.value.trim();
    if(q.length<3){showSuggestions([]);return;}
    debounceT=setTimeout(async()=>{
      const seq=++searchSeq;
      const items=await geocode(q).catch(()=>[]);
      if(seq===searchSeq) showSuggestions(items);
    },300);
  });
  inp.addEventListener("focus",()=>{sugFor=which;});
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();
      if(sugItems.length)chooseSuggestion(0);
      else{clearTimeout(debounceT);geocode(inp.value.trim()).then(items=>{
        if(items.length){sugItems=items;sugFor=which;chooseSuggestion(0);}
        else hint("Address not found — try adding the city name.",4000);}).catch(
        ()=>hint("Address search unavailable — check your connection.",4000));}
    }
    if(e.key==="Escape")showSuggestions([]);
  });
}
attachSearch(fromInp,"A"); attachSearch(toInp,"B");
sugBox.addEventListener("mousedown",e=>{
  const el=e.target.closest(".sug"); if(el)chooseSuggestion(+el.dataset.i);
});
document.querySelectorAll(".clear").forEach(b=>
  b.addEventListener("click",()=>clearEndpoint(b.dataset.clear)));

// ---------- GPX (import into OsmAnd for turn-by-turn voice nav) ----------
function toGPX(line){
  const pts=line.map(([la,lo])=>`<trkpt lat="${la}" lon="${lo}"/>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="bike-router" xmlns="http://www.topografix.com/GPX/1/1">
<trk><name>bike route</name><trkseg>${pts}</trkseg></trk></gpx>`;
}
$("gpxBtn").onclick=()=>{
  if(!lastRoute)return;
  const blob=new Blob([toGPX(lastRoute.line)],{type:"application/gpx+xml"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="bike-route.gpx";a.click();
};

// ---------- speedometer (nav mode + free-ride tracking via 📍) ----------
let trackWatch=null, lastFix=null;
function setSpeedVisible(){show($("speed"), navWatch!==null||trackWatch!==null);}
function updateSpeed(pos){
  let kmh=null;
  if(pos.coords.speed!=null&&!Number.isNaN(pos.coords.speed))kmh=pos.coords.speed*3.6;
  else if(lastFix){
    const dt=(pos.timestamp-lastFix.t)/1000;
    if(dt>0.5)kmh=hav(lastFix.la,lastFix.lo,pos.coords.latitude,pos.coords.longitude)/dt*3.6;
  }
  lastFix={la:pos.coords.latitude,lo:pos.coords.longitude,t:pos.timestamp};
  if(kmh!=null&&kmh<80)$("speedVal").textContent=Math.round(Math.max(0,kmh)); // >80 km/h on a bike = GPS jump
}
function startTracking(){
  if(!navigator.geolocation){hint("No geolocation available.",4000);return;}
  let first=true;
  trackWatch=navigator.geolocation.watchPosition(pos=>{
    const p=L.latLng(pos.coords.latitude,pos.coords.longitude);
    updateMe(p); updateSpeed(pos);
    if(first){first=false;map.setView(p,Math.max(map.getZoom(),16));hint("");}
  },()=>hint("Couldn't get your location (needs HTTPS + permission).",5000),
    {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  $("locBtn").classList.add("on"); $("speedVal").textContent="–"; setSpeedVisible();
  hint("Locating you…");
}
function stopTracking(){
  if(trackWatch!==null){navigator.geolocation.clearWatch(trackWatch);trackWatch=null;}
  $("locBtn").classList.remove("on"); setSpeedVisible();
}
$("locBtn").onclick=()=>trackWatch===null?startTracking():stopTracking();

// ---------- voice guidance (Web Speech API — built into the browser) ----------
let voiceOn=true, TURNS=[];
function speak(t){
  if(!voiceOn||!("speechSynthesis" in window))return;
  try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=1.05;
    speechSynthesis.cancel();speechSynthesis.speak(u);}catch(_){}
}
$("voiceBtn").onclick=()=>{
  voiceOn=!voiceOn;
  $("voiceBtn").textContent=voiceOn?"🔊":"🔇";
  $("voiceBtn").classList.toggle("off",!voiceOn);
  if(!voiceOn&&"speechSynthesis" in window)speechSynthesis.cancel();
  else speak("Voice guidance on");
};
function bearing(a,b){
  const y=Math.sin((b[1]-a[1])*toR)*Math.cos(b[0]*toR);
  const x=Math.cos(a[0]*toR)*Math.sin(b[0]*toR)-Math.sin(a[0]*toR)*Math.cos(b[0]*toR)*Math.cos((b[1]-a[1])*toR);
  return Math.atan2(y,x)/toR;
}
function computeTurns(){ // turn points from route geometry: bearing change over ~12m windows
  TURNS=[]; if(!lastRoute||!cum)return;
  const ln=lastRoute.line, W=12;
  for(let k=1;k<ln.length-1;k++){
    let i=k; while(i>0&&cum[k]-cum[i]<W)i--;
    let j=k; while(j<ln.length-1&&cum[j]-cum[k]<W)j++;
    const dlt=(bearing(ln[k],ln[j])-bearing(ln[i],ln[k])+540)%360-180;
    if(Math.abs(dlt)>=35){
      const last=TURNS[TURNS.length-1];
      if(last&&cum[k]-last.at<20){if(Math.abs(dlt)>Math.abs(last.d)){last.at=cum[k];last.d=dlt;}}
      else TURNS.push({at:cum[k],d:dlt,announced:0});
    }
  }
}
function turnWord(t){return (Math.abs(t.d)>110?"sharp ":"")+(t.d>0?"right":"left");}
function turnArrow(t){return t.d>0?(Math.abs(t.d)>110?"↳":"↱"):(Math.abs(t.d)>110?"↲":"↰");}
function guide(cumPos,rem){
  const t=TURNS.find(t=>t.at>cumPos+8);
  if(!t){$("turnArr").textContent="⬆";
    $("turnTxt").textContent=`${(rem/1000).toFixed(1)} km straight to destination`;return;}
  const dist=Math.max(0,t.at-cumPos), shown=dist>100?Math.round(dist/50)*50:Math.round(dist/10)*10;
  $("turnArr").textContent=turnArrow(t);
  $("turnTxt").textContent=`${shown} m`;
  if(dist<180&&t.announced<1){t.announced=1;speak(`In ${shown} meters, turn ${turnWord(t)}`);}
  if(dist<30&&t.announced<2){t.announced=2;speak(`Turn ${turnWord(t)} now`);}
}

// ---------- live navigation ----------
let navWatch=null, navFollow=true, offCount=0, cum=null, cumTotal=0;

function buildCum(){
  if(!lastRoute){cum=null;return;}
  const ln=lastRoute.line; cum=new Float64Array(ln.length); cumTotal=0;
  for(let i=1;i<ln.length;i++){cumTotal+=hav(ln[i-1][0],ln[i-1][1],ln[i][0],ln[i][1]);cum[i]=cumTotal;}
}
function nearestOnRoute(lat,lng){
  const ln=lastRoute.line; let bi=0,bd=Infinity;const cw=Math.cos(lat*toR);
  for(let i=0;i<ln.length;i++){const dy=ln[i][0]-lat,dx=(ln[i][1]-lng)*cw;
    const d=dy*dy+dx*dx; if(d<bd){bd=d;bi=i;}}
  return {i:bi, meters:hav(lat,lng,ln[bi][0],ln[bi][1])};
}
function onFix(pos){
  const {latitude:la,longitude:lo}=pos.coords, p=L.latLng(la,lo);
  updateMe(p); updateSpeed(pos);
  if(!lastRoute)return;
  const n=nearestOnRoute(la,lo);
  if(n.meters>OFFROUTE_M){
    if(++offCount>=2){offCount=0;hint("Off route — recalculating…");
      setEndpoint("A",p,"My location");return;}
  }else offCount=0;
  const rem=Math.max(0,cumTotal-cum[n.i])+n.meters;
  if(rem<ARRIVE_M){hint("🎉 You've arrived!",6000);speak("You have arrived");backToIdle();return;}
  const min=Math.max(1,Math.round(rem/1000/BIKE_KMH*60));
  $("navMin").textContent=min;
  $("navSub").textContent=`${(rem/1000).toFixed(1)} km · arrive ${fmtClock(min)}`;
  guide(cum[n.i],rem);
  if(navFollow)map.setView(p,Math.max(map.getZoom(),17));
}
function startNav(){
  if(!lastRoute||!navigator.geolocation){hint("Needs GPS + HTTPS.",4000);return;}
  stopTracking();                        // nav has its own GPS watch
  navFollow=true; offCount=0; lastFix=null; buildCum(); computeTurns();
  drawAlts(true);                        // keep only the chosen route on the map
  navWatch=navigator.geolocation.watchPosition(onFix,
    ()=>hint("Waiting for GPS…",4000),
    {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  show($("sheet"),false); show($("searchCard"),false);
  show($("navBar"),true); show($("turnBanner"),true);
  $("speedVal").textContent="–"; setSpeedVisible();
  const min=etaMin(lastRoute.meters);
  $("navMin").textContent=min;
  $("navSub").textContent=`${(lastRoute.meters/1000).toFixed(1)} km · arrive ${fmtClock(min)}`;
  speak("Starting navigation");
  guide(0,lastRoute.meters);   // after the start message: an imminent turn overrides it
}
function stopNav(){
  if(navWatch!==null){navigator.geolocation.clearWatch(navWatch);navWatch=null;}
  show($("navBar"),false); show($("turnBanner"),false);
  if("speechSynthesis" in window)speechSynthesis.cancel();
  setSpeedVisible();
  $("recenter").style.display="none"; navFollow=true;
  if(lastRoute){ // back to preview: recompute alternatives so all options return
    if(origin!==null&&dest!==null)tryRoute();
  }
}
$("go").onclick=startNav;
$("stopNavBtn").onclick=stopNav;
$("closeRoute").onclick=backToIdle;
map.on("dragstart",()=>{if(navWatch!==null){navFollow=false;$("recenter").style.display="flex";}});
$("recenter").onclick=()=>{navFollow=true;$("recenter").style.display="none";
  if(meMarker)map.setView(meMarker.getLatLng(),Math.max(map.getZoom(),17));};

// ---------- map taps & layers ----------
$("layersBtn").onclick=()=>{
  $("legend").style.display=$("legend").style.display==="block"?"none":"block";
};

// ---------- load ----------
fetch(GRAPH_URL).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(d=>{
   NODES=d.nodes; EDGES=d.edges;
   ADJ=NODES.map(()=>[]);
   LEN=new Float64Array(EDGES.length);
   EDGES.forEach((e,i)=>{ADJ[e[0]].push([e[1],e[2],i]);LEN[i]=e[2]/MULT[e[3]];});
   buildLegend();
   drawNetwork();
   if(EDGES.length){ // center on the bike infrastructure, not the whole padded bbox
     let b=null;
     for(const e of EDGES){if(CLASS[e[3]].bike){if(!b)b=L.latLngBounds(e[4]);e[4].forEach(c=>b.extend(c));}}
     if(!b){b=L.latLngBounds(EDGES[0][4]);for(const e of EDGES)e[4].forEach(c=>b.extend(c));}
     map.fitBounds(b,{padding:[20,20]});
   }
   hint("Tap “Where to?” to pick a destination.",6000);
 })
 .catch(err=>hint("Failed to load graph.json ("+err.message+")."));

// offline caching
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
